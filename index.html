<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainGauge IQ Test</title>
<meta name="theme-color" content="#2f4bff">
<meta name="description" content="Age-matched reasoning test that works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BrainGauge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#101828;--mu:#5b6578;--ac:#2f4bff;--on:#fff;--ok:#12803c;--bad:#c0262d;--bd:#d8deea;--hi:#ffb400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#151c2e;--tx:#eef1fb;--mu:#9aa5bf;--ac:#7d93ff;--on:#0d1220;--ok:#4ade80;--bad:#ff7b81;--bd:#26304a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1220;--card:#151c2e;--tx:#eef1fb;--mu:#9aa5bf;--ac:#7d93ff;--on:#0d1220;--ok:#4ade80;--bad:#ff7b81;--bd:#26304a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2.2rem;line-height:1.1;margin:.3em 0 .4em;letter-spacing:-.02em}
h2{font-size:1.25rem;line-height:1.3;margin:.3em 0 .6em}
p{margin:.4em 0}.mu{color:var(--mu)}small{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.vis{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px;font-size:1.5rem;font-weight:700;letter-spacing:.02em}
.vis svg,.opt svg{border:1px solid var(--bd);border-radius:10px;padding:4px;background:var(--bg);color:var(--tx)}
.qm{font-size:2rem;color:var(--ac)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:12px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.pat .opts{grid-template-columns:1fr 1fr}.pat .opt{display:flex;justify-content:center}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:.75rem;padding:0}
.dots .a{background:var(--ac);color:var(--on);border-color:var(--ac)}.dots .f{border:2px solid var(--hi)}.dots .c{outline:2px solid var(--tx);outline-offset:1px}
.score{text-align:center}.score .n{font-size:4.5rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.dm{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:.95rem}
.dm .bar{margin:0;height:10px}.dm .bar i{background:var(--hi)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.rv{border-top:1px solid var(--bd);padding:10px 0}.ok{color:var(--ok)}.no{color:var(--bad)}
.rv .vis{font-size:1rem}.rv svg{width:44px;height:44px}
</style>

 const next=()=>{const i=Q.queue.length?Q.queue.shift():(Q.fwd<n?Q.fwd++:-1);if(i<0||Q.wr>=3)return fin();ask(i)};

  const end=(ok,pick)=>{if(done)return;done=true;clearInterval(iv);S.tap=null;r[i]=ok?1:0;S.log.push({s:d.n,x,pick});Q.wr=ok?0:Q.wr+1;
   if(st&&i==st+1){if(r[st]&&r[st+1]){for(let k=0;k<st;k++)r[k]=1}else Q.queue=Array.from({length:st},(_,k)=>st-1-k)}

function wmRun(mode,done){let len=mode?2:(AG==0?2:3),fails=0,best=0;const max=mode?8:9;

function results(){XT=null;const c=S.c,ES=[5,7,9,11,11,9.5][AG],EP=[12,18,24,30,28,22][AG],cl=(v,a,b)=>Math.max(a,Math.min(b,v));

 const fs=Math.round(cl(100+7*(A(['SI','VO','MR','FW','VP','DS','CD'])-10),45,155)),iq=fs,pc=Math.min(99.9,Math.max(0.1,cdf((fs-100)/15)*100));
