<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,
sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},pk=a=>a[R(0,a.length-1)];
const DOM=["Numerical","Verbal","Logic","Matrices","Knowledge","Quantitative"],N=30,
AGES=[{n:"6–9",lv:[1,1,2,2,3],m:.55,t:2100},{n:"10–13",lv:[1,2,2,3,4],m:.5,t:2100},{n:"14–17",lv:[1,2,3,4,5],m:.47,t:1800},{n:"18–39",lv:[1,2,3,4,5],m:.45,t:1800},{n:"40–59",lv:[1,2,3,4,5],m:.45,t:2100},{n:"60+",lv:[1,2,3,4,5],m:.42,t:2400}];
let S=null,timer=null,AG=-1;
function hist(){try{return JSON.parse(localStorage.getItem("bg_h")||"[]")}catch(e){return[]}}
function saveH(h){try{localStorage.setItem("bg_h",JSON.stringify(h.slice(-10)))}catch(e){}}
/* Numerical generator */
function numOpts(ans){const s=new Set([ans]);while(s.size<4){const v=ans+pk([-1,1])*R(1,6);if(v>0)s.add(v)}const o=sh([...s]);return{o:o.map(String),a:o.indexOf(ans)}}
function genNum(l,t){const A=t>0;let s,e,a,b,x,y;
const V=[[()=>{a=R(1,A?20:10);x=pk(A?[2,3,4,5,6,7,9]:[1,2,3,5,10]);s=[0,1,2,3,4,5].map(i=>a+i*x);e='Each number adds '+x+'.'},()=>{x=pk(A?[2,3,4,5]:[1,2,3]);a=R(5,9)*x+5*x;s=[0,1,2,3,4,5].map(i=>a-i*x);e='Each number goes down by '+x+'.'}],
[()=>{a=R(1,3);x=A?pk([2,3]):2;s=[0,1,2,3,4,5].map(i=>a*x**i);e='Each number is multiplied by '+x+'.'},()=>{a=R(10,30);x=R(2,A?9:4);y=R(1,x-1);s=[a];for(let i=0;i<5;i++)s.push(s[i]+(i%2?-y:x));e='The numbers go up '+x+', then down '+y+', repeating.'}],
[()=>{a=R(1,9);x=R(1,3);s=[a];for(let i=0;i<5;i++)s.push(s[i]+x+i);e='The gap grows by 1 each step (+'+x+', +'+(x+1)+', +'+(x+2)+' …).'},()=>{a=R(1,6);s=[0,1,2,3,4,5].map(i=>(a+i)**2);e='These are square numbers: '+a+'², '+(a+1)+'², '+(a+2)+'² …'}],
[()=>{a=R(2,9);b=R(30,60);x=R(2,5);y=R(2,6);s=[];for(let i=0;i<3;i++)s.push(a+i*x,b-i*y);e='Two series are interleaved: one adds '+x+', the other subtracts '+y+'.'},()=>{a=R(1,4);y=R(1,3);s=[a];for(let i=0;i<5;i++)s.push(s[i]*2+y);e='Each number is double the last, plus '+y+'.'}],
[()=>{a=R(1,4);b=R(2,5);s=[a,b];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);e='Each number is the sum of the two before it.'},()=>{a=R(1,5);s=[0,1,2,3,4,5].map(i=>(a+i)*(a+i+1));e='Each is two consecutive numbers multiplied: '+a+'×'+(a+1)+', '+(a+1)+'×'+(a+2)+' …'}]];
pk(A||l<3?V[l-1]:V[l-1].slice(0,1))();const o=numOpts(s[5]);return{d:0,l,q:'What number comes next?',v:s.slice(0,5).join(', ')+', <span class=qm>?</span>',o:o.o,a:o.a,e}}
function genNumOld(l){let t,e,a,b,d;
 if(l==1){a=R(1,20);d=R(2,9);t=[0,1,2,3,4,5].map(i=>a+i*d);e="Each number adds "+d+".";}
 else if(l==2){a=R(1,4);d=R(2,3);t=[0,1,2,3,4,5].map(i=>a*d**i);e="Each number is multiplied by "+d+".";}
 else if(l==3){a=R(1,9);d=R(1,3);t=[a];for(let i=0;i<5;i++)t.push(t[i]+d+i);e="The gap grows by 1 each step (+"+d+", +"+(d+1)+", +"+(d+2)+" …).";}
 else if(l==4){a=R(2,9);b=R(30,60);const x=R(2,5),y=R(2,6);t=[];for(let i=0;i<3;i++)t.push(a+i*x,b-i*y);e="Two series are interleaved: one adds "+x+", the other subtracts "+y+".";}
 else{a=R(1,4);b=R(2,5);t=[a,b];for(let i=2;i<6;i++)t.push(t[i-1]+t[i-2]);e="Each number is the sum of the two before it.";}
 const o=numOpts(t[5]);return{d:0,l,q:"What number comes next?",v:t.slice(0,5).join(", ")+", <span class=qm>?</span>",o:o.o,a:o.a,e}}
/* Pattern generator */

function wmRun(mode,done){let len=mode?2:(AG==0?2:3),fails=0,best=0;const max=mode?8:9;
 const next=()=>{const seq=Array.from({length:len},()=>R(0,9));let i=0,ans='';
  $('#app').innerHTML=`<div class=card style="text-align:center"><small>${mode?'Memorize the digits (you will type them in reverse)':'Memorize the digits'}</small><div id=dg style="font-size:4.5rem;font-weight:800;min-height:6rem"></div></div>`;
  const step=()=>{if(i<seq.length){const d=$('#dg');if(d)d.textContent=seq[i++];setTimeout(()=>{const d2=$('#dg');if(d2)d2.textContent='';setTimeout(step,350)},850)}else ask()};
  const ask=()=>{$('#app').innerHTML=`<div class=card style="text-align:center"><small>Type the digits${mode?' in reverse order':''}</small><div id=en style="font-size:2rem;font-weight:700;min-height:3rem;letter-spacing:.25em"></div><div class=opts style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6,7,8,9,'\u232b',0,'OK'].map(k=>`<button class=opt data-p="${k}">${k}</button>`).join('')}</div></div>`;
   S.tap=e=>{const b=e.target.closest('button');if(!b||b.dataset.p==null)return;const k=b.dataset.p;
    if(k=='OK'){S.tap=null;const ex=(mode?seq.slice().reverse():seq).join('');if(ans==ex){best=len;len++;fails=0}else fails++;if(fails>=2||len>max)done(best);else next();return}
    if(k=='\u232b')ans=ans.slice(0,-1);else if(ans.length<len)ans+=k;$('#en').textContent=ans}};
  setTimeout(step,600)};
 next()}
function spd(done){const sy=['\u25b2','\u25cf','\u25a0','\u25c6','\u2605','\u2665'],mp=sh([1,2,3,4,5,6]),T=AG<2?60:45;let n=0,w=0,cur=R(0,5),left=T,iv;
 const draw=()=>{$('#app').innerHTML=`<div class=top><span>Match the symbols</span><span id=sc>${left}s</span></div><div class=card><div class=key>${sy.map((x,i)=>`<div><b>${x}</b><br>${mp[i]}</div>`).join('')}</div><div style="font-size:5rem;text-align:center;margin:10px 0">${sy[cur]}</div><div class=opts style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6].map(k=>`<button class=opt data-p="${k}">${k}</button>`).join('')}</div></div>`};
 S.tap=e=>{const b=e.target.closest('button');if(!b||b.dataset.p==null)return;if(+b.dataset.p===mp[cur])n++;else w++;let c;do{c=R(0,5)}while(c==cur);cur=c;draw()};
 draw();iv=setInterval(()=>{left--;const t=$('#sc');if(t)t.textContent=left+'s';if(left<=0){clearInterval(iv);S.tap=null;done(Math.max(0,n-Math.floor(w/2)))}},1000)}
function phase2(){S.wm=[0,0];S.sp=0;ph('Part 2: Memory','Digits will appear one at a time. Afterwards, type them back in the same order. Each round gets longer.',()=>wmRun(0,a=>{S.wm[0]=a;ph('Now in reverse','Next, type the digits back in reverse order. If you see 3, 8, 1 you enter 1, 8, 3.',()=>wmRun(1,b=>{S.wm[1]=b;ph('Part 3: Speed','Match each symbol to its number using the key at the top. You have '+(AG<2?60:45)+' seconds. Go as fast as you can.',()=>spd(r=>{S.sp=r;results()}))}))}))}
function finish(){clearInterval(timer);S.done=1;phase2()}
function results(){const w=[0,0,0,0,0,0],m=[0,0,0,0,0,0];let raw=0;
S.qs.forEach((q,k)=>{m[q.d]+=q.l;if(S.ans[k]===q.a){w[q.d]+=q.l;raw+=q.l}});
const dv=m.map((x,k)=>w[k]/x-S.c.m),ES=[5,7,9,11,11,9.5][AG],EP=[12,18,24,30,28,22][AG],dW=(S.wm[0]+S.wm[1]-ES)/12,dS=(S.sp-EP)/60,dev=(dv.reduce((a,b)=>a+b,0)+dW+dS)/8,ix=d=>Math.round(Math.max(55,Math.min(145,100+100*d))),iq=Math.max(70,ix(dev)),pc=Math.min(99.9,Math.max(0.1,cdf((iq-100)/15)*100));
const date=new Date().toLocaleDateString(),h=hist();h.push({iq,d:date,a:S.c.n});saveH(h);S.res={iq};
const cat=iq>=130?"Very high":iq>=115?"Above average":iq>=85?"Average":"Below average";
const arc=Math.round((iq-70)/75*100);
$("#app").innerHTML=`<div class="card score"><small>Your estimated IQ</small>
<svg viewBox="0 0 200 110" width="220"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--bd)" stroke-width="14" stroke-linecap="round" pathLength="100"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--ac)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${arc} 100"/><text x="100" y="92" text-anchor="middle" font-size="44" font-weight="800" fill="var(--tx)">${iq}</text></svg>
<p><b>${cat}</b> · likely range ${iq-7}–${iq+7}</p><p class=mu>Higher than about ${Math.round(pc)}% of people aged ${S.c.n} on the rough scale used here.</p></div>
<div class=card><b>By area</b>${DOM.map((n,k)=>{const p=Math.round(w[k]/m[k]*100);return `<div class=dm><span>${n}</span><div class=bar><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join("")}</div>
<div class=card><b>Index scores</b> <small>(Wechsler and Stanford-Binet style)</small>${[['Verbal',(dv[1]+dv[4])/2],['Fluid reasoning',(dv[2]+dv[3])/2],['Quantitative',(dv[0]+dv[5])/2],['Working memory',dW],['Processing speed',dS]].map(a=>`<div class=dm><span>${a[0]}</span><div class=bar><i style="width:${(ix(a[1])-55)/.9}%"></i></div><span>${ix(a[1])}</span></div>`).join('')}<p class=mu>Memory: ${S.wm[0]} digits forward, ${S.wm[1]} in reverse. Speed: ${S.sp} correct matches.</p></div>
<details class=card><summary>Review answers (${S.qs.filter((q,k)=>S.ans[k]!==q.a).length} missed)</summary>${S.qs.map((q,k)=>{const ok=S.ans[k]===q.a;return `<div class=rv><b class="${ok?"ok":"no"}">${ok?"Correct":"Missed"}</b> · <small>${DOM[q.d]}, level ${q.l}</small><p>${q.q}</p>${q.v?`<div class=vis>${q.v}</div>`:""}${ok?"":`<p class=mu>You chose: ${S.ans[k]==null?"no answer":q.o[S.ans[k]]}</p>`}<p>Answer: ${q.o[q.a]}</p><p class=mu>${q.e}</p></div>`}).join("")}</details>
<div class=row><button class="btn alt" id=cp>Copy result</button><button class=btn id=re>New test</button></div>
<p><small>Estimate only. Scores are adjusted by age group using rough assumptions, not real norm data, and are not a clinical IQ result.</small></p>`;
$("#re").onclick=intro;$("#cp").onclick=async()=>{const t="I scored an estimated IQ of "+iq+" on BrainGauge (age group "+S.c.n+").";try{await navigator.clipboard.writeText(t);$("#cp").textContent="Copied"}catch(e){$("#cp").textContent=t}}}
intro();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}})}
</script></body></html>
